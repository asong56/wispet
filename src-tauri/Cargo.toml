[package]
name = "wispet"
version = "0.1.0"
edition = "2021"
description = "Wispet — lightweight dictionary & translation"
authors = ["asong56"]

[[bin]]
name = "wispet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "image-ico",
] }
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
encoding_rs = "0.8"
flate2 = "1"
lzo1x = "0.2"
futures = "0.3"
urlencoding = "2"
regex-lite = "0.1"
http = "1"
md-5 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
