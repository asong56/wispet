name: Release

on:
  push:
    tags:
      - 'v[0-9999]+.[0-9999]+.[0-9999]+'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: wispet
            asset_name: wispet-linux-amd64
          - os: macos-latest
            artifact_name: wispet
            asset_name: wispet-macos-arm64
          - os: windows-latest
            artifact_name: wispet.exe
            asset_name: wispet-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build release bundle
        run: cd src-tauri && cargo tauri build --release
        env:
          RUSTFLAGS: "-D warnings"

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp src-tauri/target/release/${{ matrix.artifact_name }} \
             ${{ matrix.asset_name }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item src-tauri\target\release\${{ matrix.artifact_name }} `
                    ${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (for CHANGELOG / tag message)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Compute SHA-256 checksums
        run: |
          cd dist
          find . -type f | sort | xargs sha256sum | tee ../checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Wispet ${{ github.ref_name }}"
          body: |
            ## Wispet ${{ github.ref_name }}

            ### Downloads

            | Platform | Binary |
            |----------|--------|
            | Linux x86-64 | `wispet-linux-amd64` |
            | macOS Apple Silicon | `wispet-macos-arm64` |
            | Windows x86-64 | `wispet-windows-amd64.exe` |

            See `checksums.txt` for SHA-256 verification.

            ### Changelog

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            or the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
            for what changed in this release.
          files: |
            dist/**/*
            checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
