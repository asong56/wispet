name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build release bundle
        run: cd src-tauri && cargo tauri build
        env:
          RUSTFLAGS: "-D warnings"

      - name: Stage binary
        shell: pwsh
        run: Copy-Item src-tauri\target\release\wispet.exe wispet-windows-amd64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wispet-windows-amd64.exe
          path: wispet-windows-amd64.exe
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (for CHANGELOG / tag message)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Compute SHA-256 checksum
        run: |
          cd dist
          find . -type f | sort | xargs sha256sum | tee ../checksums.txt

      - name: Resolve release tag
        id: tag
        run: |
          # On a tag push, github.ref_name is already the tag (e.g. v0.1.0).
          # On workflow_dispatch, github.ref_name is the branch ("main"), which
          # is not a tag and is why action-gh-release fails with "requires a
          # tag" — the tag has to be supplied explicitly in that case.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Wispet ${{ steps.tag.outputs.value }}"
          body: |
            ## Wispet ${{ steps.tag.outputs.value }}

            Windows x86-64 only.

            See `checksums.txt` for SHA-256 verification.
          files: |
            dist/**/*
            checksums.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
