<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Wispet</title>
  <link rel="stylesheet" href="css/acdn.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<section id="app" class="entering">

  <header class="search-bar" data-tauri-drag-region>

    <svg class="search-icon" viewBox="0 0 256 256">
      <path d="M228.24,219.76l-51.38-51.38a86.15,86.15,0,1,0-8.48,8.48l51.38,51.38a6,6,0,0,0,8.48-8.48ZM38,112a74,74,0,1,1,74,74A74.09,74.09,0,0,1,38,112Z"/>
    </svg>

    <input
      id="search-input"
      type="search"
      placeholder="Look up a word…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    />

    <button
      id="btn-clear"
      class="icon-btn"
      style="display:none"
      title="Clear (Esc)"
    >
      <svg viewBox="0 0 256 256">
        <path d="M204.24,195.76a6,6,0,1,1-8.48,8.48L128,136.49,60.24,204.24a6,6,0,0,1-8.48-8.48L119.51,128,51.76,60.24a6,6,0,0,1,8.48-8.48L128,119.51l67.76-67.75a6,6,0,0,1,8.48,8.48L136.49,128Z"/>
      </svg>
    </button>

  </header>

  <section id="empty-state">
    <svg viewBox="0 0 256 256">
      <path d="M228.24,219.76l-51.38-51.38a86.15,86.15,0,1,0-8.48,8.48l51.38,51.38a6,6,0,0,0,8.48-8.48ZM38,112a74,74,0,1,1,74,74A74.09,74.09,0,0,1,38,112Z"/>
    </svg>
    <p>Type to look up a word or phrase</p>
  </section>

  <main id="results-view" style="display:none">
  </main>

</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
