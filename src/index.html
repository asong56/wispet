<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Wispet</title>
  <link rel="stylesheet" href="css/acdn.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app">

  <!-- ── Search header ───────────────────────────────────────────────────── -->
  <header class="search-bar" data-tauri-drag-region>

    <svg class="search-icon" viewBox="0 0 256 256" aria-hidden="true">
      <path d="M228.24,219.76l-51.38-51.38a86.15,86.15,0,1,0-8.48,8.48l51.38,51.38a6,6,0,0,0,8.48-8.48ZM38,112a74,74,0,1,1,74,74A74.09,74.09,0,0,1,38,112Z"/>
    </svg>

    <input
      id="search-input"
      type="search"
      placeholder="Look up a word…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Search"
    />

    <!-- Clear button -->
    <button
      id="btn-clear"
      class="icon-btn"
      aria-label="Clear"
      style="display:none"
      title="Clear (Esc)"
    >
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <path d="M204.24,195.76a6,6,0,1,1-8.48,8.48L128,136.49,60.24,204.24a6,6,0,0,1-8.48-8.48L119.51,128,51.76,60.24a6,6,0,0,1,8.48-8.48L128,119.51l67.76-67.75a6,6,0,0,1,8.48,8.48L136.49,128Z"/>
      </svg>
    </button>

    <div class="header-actions">
      <!-- Settings -->
      <button
        id="btn-settings"
        class="icon-btn"
        aria-label="Settings"
        aria-pressed="false"
        title="Settings (⌘,)"
      >
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M128,82a46,46,0,1,0,46,46A46.06,46.06,0,0,0,128,82Zm0,80a34,34,0,1,1,34-34A34,34,0,0,1,128,162ZM214,130.84c.06-1.89.06-3.79,0-5.68L229.33,106a6,6,0,0,0,1.11-5.29A105.34,105.34,0,0,0,219.76,74.9a6,6,0,0,0-4.53-3l-24.45-2.71q-1.93-2.07-4-4l-2.72-24.46a6,6,0,0,0-3-4.53,105.65,105.65,0,0,0-25.77-10.66A6,6,0,0,0,150,26.68l-19.2,15.37c-1.89-.06-3.79-.06-5.68,0L106,26.67a6,6,0,0,0-5.29-1.11A105.34,105.34,0,0,0,74.9,36.24a6,6,0,0,0-3,4.53L69.23,65.22q-2.07,1.94-4,4L40.76,72a6,6,0,0,0-4.53,3,105.65,105.65,0,0,0-10.66,25.77A6,6,0,0,0,26.68,106l15.37,19.2c-.06,1.89-.06,3.79,0,5.68L26.67,150.05a6,6,0,0,0-1.11,5.29A105.34,105.34,0,0,0,36.24,181.1a6,6,0,0,0,4.53,3l24.45,2.71q1.94,2.07,4,4L72,215.24a6,6,0,0,0,3,4.53,105.65,105.65,0,0,0,25.77,10.66,6,6,0,0,0,5.29-1.11L125.16,214c1.89.06,3.79.06,5.68,0l19.21,15.38a6,6,0,0,0,5.29,1.11,105.34,105.34,0,0,0,25.76-10.68,6,6,0,0,0,3-4.53l2.71-24.45q2.07-1.93,4-4l24.46-2.72a6,6,0,0,0,4.53-3,105.49,105.49,0,0,0,10.66-25.77,6,6,0,0,0-1.11-5.29Z"/>
        </svg>
      </button>

      <!-- Close / hide to tray -->
      <button
        id="btn-close"
        class="icon-btn"
        aria-label="Hide to tray"
        title="Hide (Esc)"
      >
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M204.24,195.76a6,6,0,1,1-8.48,8.48L128,136.49,60.24,204.24a6,6,0,0,1-8.48-8.48L119.51,128,51.76,60.24a6,6,0,0,1,8.48-8.48L128,119.51l67.76-67.75a6,6,0,0,1,8.48,8.48L136.49,128Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Empty / welcome state ────────────────────────────────────────────── -->
  <div id="empty-state" style="display:flex">
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <path d="M228.24,219.76l-51.38-51.38a86.15,86.15,0,1,0-8.48,8.48l51.38,51.38a6,6,0,0,0,8.48-8.48ZM38,112a74,74,0,1,1,74,74A74.09,74.09,0,0,1,38,112Z"/>
    </svg>
    <p>Type to look up a word or phrase</p>
    <p style="font-size:var(--text-xs)">
      Select text anywhere and press
      <kbd class="hint-key">Alt+D</kbd>
      for quick translate
    </p>
  </div>

  <!-- ── Results view ─────────────────────────────────────────────────────── -->
  <main id="results-view" style="display:none" role="region" aria-label="Results">
  </main>

  <!-- ── Settings view ────────────────────────────────────────────────────── -->
  <div id="settings-view" style="display:none" role="region" aria-label="Settings">

    <!-- Sidebar nav -->
    <nav class="settings-nav" aria-label="Settings sections">
      <!-- Rendered by settings.js -->
    </nav>

    <!-- Content area -->
    <div class="settings-content">

      <!-- General pane -->
      <div class="settings-pane" data-pane="general">
        <!-- Rendered by settings.js -->
      </div>

      <!-- Providers pane -->
      <div class="settings-pane" data-pane="providers" style="display:none">
        <!-- Rendered by settings.js -->
      </div>

      <!-- About pane -->
      <div class="settings-pane" data-pane="about" style="display:none">
        <!-- Rendered by settings.js -->
      </div>

    </div>

    <!-- Save bar -->
    <footer class="save-bar">
      <button id="settings-save-btn" data-variant="primary">Save</button>
    </footer>

  </div><!-- /#settings-view -->

</div><!-- /#app -->

<script type="module" src="js/main.js"></script>
</body>
</html>
